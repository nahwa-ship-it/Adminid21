<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk — Laporan Nahwa</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Sistem Sukses Nahwa</span>
    <h1>Masuk</h1>
    <p class="hint">Login pakai akun kamu. Staff baru bisa daftar sendiri di bawah.</p>

    <form id="loginForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <p class="auth-error" id="loginError"></p>
      <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>
    </form>

    <p class="auth-switch"><a href="forgot-password.html">Lupa password?</a></p>
    <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth-client.js"></script>
<script>
  (async () => {
    const session = await getSession();
    if (session) window.location.href = "index.html";
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("loginError");
    errEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Memeriksa…";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = "Email atau password salah.";
      btn.disabled = false;
      btn.textContent = "Masuk";
      return;
    }

    await touchLastLogin();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
