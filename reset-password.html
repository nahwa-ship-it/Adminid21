<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buat Password Baru — Laporan Nahwa</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Sistem Sukses Nahwa</span>
    <h1>Password Baru</h1>
    <p class="hint" id="pageHint">Masukkan password baru kamu.</p>

    <form id="resetForm">
      <div class="auth-field">
        <label for="password">Password baru</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6" />
      </div>
      <div class="auth-field">
        <label for="password2">Ulangi password baru</label>
        <input type="password" id="password2" required autocomplete="new-password" minlength="6" />
      </div>
      <p class="auth-error" id="resetError"></p>
      <p class="auth-success" id="resetSuccess"></p>
      <button type="submit" class="btn-primary" id="resetBtn">Simpan Password</button>
    </form>

    <p class="auth-switch"><a href="login.html">← Kembali ke halaman masuk</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth-client.js"></script>
<script>
  const hintEl = document.getElementById("pageHint");
  const form = document.getElementById("resetForm");
  const errEl = document.getElementById("resetError");
  const okEl = document.getElementById("resetSuccess");

  // Link dari email membawa token khusus di URL; Supabase otomatis
  // membacanya dan membuat sesi sementara begitu halaman ini dibuka.
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      hintEl.textContent = "Link reset tidak valid atau sudah kedaluwarsa. Minta link baru lewat halaman Lupa Password.";
      form.style.display = "none";
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    const btn = document.getElementById("resetBtn");
    errEl.textContent = "";
    okEl.textContent = "";

    if (password.length < 6) {
      errEl.textContent = "Password minimal 6 karakter.";
      return;
    }
    if (password !== password2) {
      errEl.textContent = "Password tidak sama.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Menyimpan…";

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      errEl.textContent = "Gagal simpan: " + error.message;
      btn.disabled = false;
      btn.textContent = "Simpan Password";
      return;
    }

    okEl.textContent = "Password berhasil diganti! Mengarahkan ke halaman laporan…";
    setTimeout(() => { window.location.href = "index.html"; }, 1500);
  });
</script>
</body>
</html>
