<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lupa Password — Laporan Nahwa</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Sistem Sukses Nahwa</span>
    <h1>Lupa Password</h1>
    <p class="hint">Masukkan email akun kamu. Link buat bikin password baru akan dikirim ke email itu.</p>

    <form id="forgotForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <p class="auth-error" id="forgotError"></p>
      <p class="auth-success" id="forgotSuccess"></p>
      <button type="submit" class="btn-primary" id="forgotBtn">Kirim Link Reset</button>
    </form>

    <p class="auth-switch"><a href="login.html">← Kembali ke halaman masuk</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth-client.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("forgotBtn");
    const errEl = document.getElementById("forgotError");
    const okEl = document.getElementById("forgotSuccess");
    errEl.textContent = "";
    okEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Mengirim…";

    const redirectTo = new URL("reset-password.html", window.location.href).href;
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

    btn.disabled = false;
    btn.textContent = "Kirim Link Reset";

    if (error) {
      errEl.textContent = "Gagal kirim: " + error.message;
      return;
    }
    okEl.textContent = "Kalau email itu terdaftar, link reset sudah dikirim. Cek inbox (atau folder spam) kamu.";
    document.getElementById("forgotForm").reset();
  });
</script>
</body>
</html>
